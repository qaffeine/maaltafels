<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Maaltafels</title>
  <meta name="theme-color" content="#2d7543">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Maaltafels">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">

</head>
<body>
  <main id="app" aria-live="polite"></main>
  <noscript>Zet JavaScript aan om de maaltafels te spelen.</noscript>

  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline support (only when served from a web address, not when opened as a file).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* game still works online */ });
    }
  </script>
